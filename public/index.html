<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تفاهُم · Rapport</title>
  <meta name="description" content="اختبارات قصيرة لأسلوب العمل والشخصية، ولوحة لقائد الفريق تحوّل النتائج إلى إرشادات وخطط تطوير.">
  <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10151D" media="(prefers-color-scheme: dark)">
  <script>
    // Apply a saved light/dark choice before the first paint, so the page doesn't flash.
    try {
      var saved = JSON.parse(localStorage.getItem('tp.theme'));
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div id="app"><p class="boot">تفاهُم · Rapport</p></div>
  <noscript><p class="boot">يحتاج هذا الموقع إلى JavaScript. This site needs JavaScript.</p></noscript>
</body>
</html>
